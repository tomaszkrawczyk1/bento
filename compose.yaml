name: bento
x-common: &common
  image: bento-runtime:local
  build:
    context: .
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  init: true
  healthcheck:
    test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/readyz]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 30s
  working_dir: /home/pc/sandbox/bento
  environment: &env
    HF_HUB_OFFLINE: '1'
    OMP_NUM_THREADS: '4'
    BENTOML_HOME: /home/pc/sandbox/bento/data/bentoml
  volumes: &volumes
    - ./.venv:/home/pc/sandbox/bento/.venv:ro
    - ./.venv-mitra:/home/pc/sandbox/bento/.venv-mitra:ro
    - ./vendor:/home/pc/sandbox/bento/vendor:ro
    - ./weights:/home/pc/sandbox/bento/weights:ro
    - ./data:/home/pc/sandbox/bento/data
    - ./data/artifacts/AutogluonModels:/home/pc/sandbox/bento/AutogluonModels
    - ./sources.yaml:/home/pc/sandbox/bento/sources.yaml:ro
    - ./deploy/public-url.txt:/home/pc/sandbox/bento/deploy/public-url.txt:ro
  extra_hosts:
    - 'host.docker.internal:host-gateway'
services:
  gateway:
    <<: *common
    command: [.venv/bin/python, -m, bentoml, serve, 'app.gateway:Gateway', --host, 0.0.0.0, --port, '3000']
    environment:
      <<: *env
      DEMO_POSTGRES_DSN: ${DEMO_POSTGRES_DSN:-}
      TABICL_URL: http://tabicl:3000
      MITRA_URL: http://mitra:3000
      TIMESTRAL_URL: http://timestral:3000
      KAGGLE_CONFIG_DIR: /run/secrets
      KAGGLE_WORKSPACES: bento-team
      KAGGLE_CACHE_BYTES: '0'
    secrets:
      - source: kaggle_credentials
        target: kaggle.json
      - source: url_source_credentials
        target: url-sources.json
    ports: ['192.168.3.27:3000:3000', '127.0.0.1:3000:3000']
    depends_on:
      tabicl: {condition: service_healthy}
      mitra: {condition: service_healthy}
      timestral: {condition: service_healthy}
  tabicl:
    <<: *common
    command: [.venv/bin/python, -m, bentoml, serve, 'models.service:ModelService', --host, 0.0.0.0, --port, '3000']
    environment:
      <<: *env
      MODEL_BACKEND: tabicl
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  mitra:
    <<: *common
    command: [.venv-mitra/bin/python, -m, bentoml, serve, 'models.service:ModelService', --host, 0.0.0.0, --port, '3000']
    environment:
      <<: *env
      MODEL_BACKEND: mitra
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  timestral:
    <<: *common
    command: [.venv/bin/python, -m, bentoml, serve, 'models.timestral_service:TimestralService', --host, 0.0.0.0, --port, '3000']
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
secrets:
  kaggle_credentials:
    file: ./.credentials/kaggle.json
  url_source_credentials:
    file: ./.credentials/url-sources.json
