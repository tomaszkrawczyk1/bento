events {}
http {
  access_log off;
  server {
    listen 3003;
    client_max_body_size 0;
    location ~ ^(/mcp(/|$)|/t/[A-Za-z0-9_-]+/mcp/?$|/oauth/|/\.well-known/|/upload/|/download/|/health$) {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
    location = / { return 200 'Bento Tabular GPU: authenticated MCP at /mcp'; }
    location / { return 404; }
  }
}
